name: Feature request
description: Suggest an idea or a new provider integration
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation and who runs into it, such as merchants, their customers or upstream providers.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, or how other billing systems handle this.
