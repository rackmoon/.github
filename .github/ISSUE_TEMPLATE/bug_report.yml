name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security issues, follow the security policy instead of opening an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release version or commit hash.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, deployment method, database, and the provider plugins involved.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove secrets and customer data first.
      render: shell
